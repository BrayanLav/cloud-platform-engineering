###############################################################################
# NGINX Ingress Controller - EKS con Fargate
###############################################################################
# IMPORTANTE: Usar chart versión >= 4.12.0 (controller >= v1.12.1)
# Versiones anteriores tienen vulnerabilidad CRÍTICA CVE-2025-1974
# (IngressNightmare - RCE sin autenticación, CVSS 9.8)
###############################################################################

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  replicaCount: 2

  # NLB internet-facing (accesible desde cualquier navegador)
  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    type: LoadBalancer

  # Métricas para Prometheus (etapa 3)
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false  # Se habilita en etapa 3

  # Configuración global
  config:
    use-forwarded-headers: "true"
    proxy-body-size: "50m"
    proxy-read-timeout: "120"

  admissionWebhooks:
    enabled: true
    # NOTA: El admission webhook fue parte del vector de ataque de
    # IngressNightmare (CVE-2025-1974). Con el chart >= 4.12.0 está parcheado.
    # Si quieres extra seguridad, puedes deshabilitarlo (pero pierdes
    # validación de Ingress resources antes de aplicarlas).

defaultBackend:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
