## helm/values-prometheus.yaml
# Configuración específica para EKS en Fargate

# Desactivar componentes del control plane que no son accesibles en EKS
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Desactivar alertas por defecto para componentes desactivados
defaultRules:
  create: true
  rules:
    kubeScheduler: false
    kubeControllerManager: false
    kubeProxy: false
    kubeApiserver: false
    kubeEtcd: false

# Fargate NO soporta DaemonSets, por lo que node-exporter no funcionará
nodeExporter:
  enabled: false

prometheus:
  prometheusSpec:
    # Fargate NO soporta volúmenes EBS
    # En producción usaríamos Amazon Managed Prometheus o EFS.
    # Aquí usamos emptyDir, es decir, el almacenamiento será efímero.
    storageSpec:
      emptyDir:
        medium: ""
    retention: 2d

grafana:
  enabled: true
  adminPassword: "admin"
  
  # Fargate NO soporta volúmenes EBS, así que quitamos la persistencia local
  persistence:
    enabled: false
    
  # Configuración para que funcione bajo el path /grafana del Ingress
  grafana.ini:
    server:
      domain: localhost
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
