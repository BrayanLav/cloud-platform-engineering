###############################################################################
# App gestionada por ArgoCD - Hello GitOps
###############################################################################
# BUENAS PRÁCTICAS:
# - Labels estándar de Kubernetes
# - Resource requests y limits
# - Probes de salud
# - Réplicas > 1
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-gitops
  labels:
    app.kubernetes.io/name: hello-gitops
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: cloud-platform
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-gitops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-gitops
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: cloud-platform
    spec:
      # BUENA PRÁCTICA: Security context restrictivo
      securityContext:
        runAsNonRoot: false  # http-echo necesita root; en apps reales usar true
      # BUENA PRÁCTICA: No montar el service account token si no lo necesitas
      # Si un atacante entra al pod, no puede hablar con el API de Kubernetes
      automountServiceAccountToken: false
      containers:
        - name: hello
          image: hashicorp/http-echo:0.2.3
          args:
            - "-text=Desplegado con ArgoCD GitOps! 🔄"
          ports:
            - containerPort: 5678
              name: http
              protocol: TCP
          # BUENA PRÁCTICA: Security context por container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello-gitops
  labels:
    app.kubernetes.io/name: hello-gitops
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: hello-gitops
