###############################################################################
# ArgoCD - EKS con Fargate
###############################################################################

server:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Insecure para funcionar detrás del Ingress sin TLS issues
  extraArgs:
    - --insecure
    - --rootpath
    - /argocd

  service:
    type: ClusterIP

repoServer:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

dex:
  enabled: false

notifications:
  enabled: false

configs:
  params:
    server.basehref: /argocd
    server.rootpath: /argocd
