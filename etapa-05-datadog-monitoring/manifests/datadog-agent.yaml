apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    credentials:
      apiSecret:
        secretName: datadog-keys
        keyName: api-key
      appSecret:
        secretName: datadog-keys
        keyName: app-key
    site: datadoghq.com
    clusterName: platform-lab-cluster
    tags:
      - "env:lab"
      - "project:cloud-platform"
  features:
    kubeStateMetricsCore:
      enabled: true
    # Logs are tricky on Fargate without sidecars or fluentbit, disabled for this basic lab
    logCollection:
      containerCollectAll: false
  # Activamos el Cluster Agent (único componente soportado nativamente en Fargate sin sidecars para ver info del clúster)
  clusterAgent:
    replicas: 1
  # IMPORTANTE: Eliminamos por completo la sección 'nodeAgent' porque
  # en EKS Fargate NO se soportan DaemonSets.
